<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Mini 1 Tools</title>
    <style>
        /* Simple, old-WebKit-friendly styling */
        body {
            background: #0f1115;
            color: #e8e8e8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            color: #c2c6cc;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 20px;
        }

        .tool-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .tool-item {
            margin-bottom: 12px;
        }

        .tool-link {
            display: block;
            padding: 14px 16px;
            background: #1b1f26;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            text-decoration: none;
            color: #f4f4f4;
        }

        .tool-link:active {
            background: #252b36;
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>Tool Links</h1>
        <p>Quick launcher for the available HTML tools on this device.</p>
        <ul class="tool-list">
            <li class="tool-item">
                <a class="tool-link" href="flip_clock.html">Flip Clock</a>
            </li>
        </ul>
    </div>
</body>

</html>
