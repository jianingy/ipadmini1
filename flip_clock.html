<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: -webkit-box;
            -webkit-box-pack: center;
            -webkit-box-align: center;
            min-height: 100vh;
            font-family: "Space Mono", monospace;
            font-weight: 700;
            font-style: normal;
        }

        .clock-container {
            display: -webkit-box;
            -webkit-box-orient: horizontal;
            gap: 20px;
        }

        .time-unit {
            display: -webkit-box;
            -webkit-box-orient: horizontal;
            gap: 10px;
        }

        .flip-card {
            position: relative;
            width: 80px;
            height: 120px;
            perspective: 500px;
            -webkit-perspective: 500px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .flip-card-top,
        .flip-card-bottom {
            position: absolute;
            width: 100%;
            height: 50%;
            background: #333;
            border: 2px solid #000;
            overflow: hidden;
            -webkit-border-radius: 4px;
        }

        .flip-card-top {
            top: 0;
            -webkit-border-bottom-left-radius: 0;
            -webkit-border-bottom-right-radius: 0;
        }

        .flip-card-bottom {
            bottom: 0;
            -webkit-border-top-left-radius: 0;
            -webkit-border-top-right-radius: 0;
        }

        .flip-card-number {
            position: absolute;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 72px;
            font-weight: bold;
            color: #fff;
            line-height: 120px;
        }

        .flip-card-top .flip-card-number {
            top: 0;
        }

        .flip-card-bottom .flip-card-number {
            top: -60px;
        }

        .flip-card-flip {
            position: absolute;
            width: 100%;
            height: 50%;
            top: 0;
            -webkit-transform-origin: bottom;
            -webkit-transform-style: preserve-3d;
            -webkit-transform: rotateX(0deg);
            z-index: 2;
        }

        .flip-card-flip.flipping {
            -webkit-animation: flip 0.6s ease-in-out;
        }

        @-webkit-keyframes flip {
            0% {
                -webkit-transform: rotateX(0deg);
            }

            100% {
                -webkit-transform: rotateX(-180deg);
            }
        }

        .flip-face-front,
        .flip-face-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #333;
            border: 2px solid #000;
            overflow: hidden;
            -webkit-backface-visibility: hidden;
        }

        .flip-face-front {
            -webkit-border-radius: 4px;
            -webkit-border-bottom-left-radius: 0;
            -webkit-border-bottom-right-radius: 0;
            z-index: 2;
        }

        .flip-face-back {
            -webkit-transform: rotateX(-180deg);
            -webkit-border-radius: 4px;
            -webkit-border-top-left-radius: 0;
            -webkit-border-top-right-radius: 0;
            z-index: 1;
        }

        .flip-face-front .flip-card-number {
            top: 0;
        }

        .flip-face-back .flip-card-number {
            top: -60px;
        }

        .separator {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-box-pack: center;
            font-size: 60px;
            color: #fff;
            font-weight: bold;
            padding: 0 10px;
            margin-bottom: 35px;
        }

        .label {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 10px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="clock-container">
        <div>
            <div class="time-unit">
                <div class="flip-card" id="hour-tens">
                    <div class="flip-card-inner">
                        <div class="flip-card-top">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-bottom">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-flip">
                            <div class="flip-face-front">
                                <div class="flip-card-number">0</div>
                            </div>
                            <div class="flip-face-back">
                                <div class="flip-card-number">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flip-card" id="hour-ones">
                    <div class="flip-card-inner">
                        <div class="flip-card-top">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-bottom">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-flip">
                            <div class="flip-face-front">
                                <div class="flip-card-number">0</div>
                            </div>
                            <div class="flip-face-back">
                                <div class="flip-card-number">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="label">Hours</div>
        </div>

        <div class="separator">:</div>

        <div>
            <div class="time-unit">
                <div class="flip-card" id="minute-tens">
                    <div class="flip-card-inner">
                        <div class="flip-card-top">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-bottom">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-flip">
                            <div class="flip-face-front">
                                <div class="flip-card-number">0</div>
                            </div>
                            <div class="flip-face-back">
                                <div class="flip-card-number">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flip-card" id="minute-ones">
                    <div class="flip-card-inner">
                        <div class="flip-card-top">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-bottom">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-flip">
                            <div class="flip-face-front">
                                <div class="flip-card-number">0</div>
                            </div>
                            <div class="flip-face-back">
                                <div class="flip-card-number">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="label">Minutes</div>
        </div>

        <div class="separator">:</div>

        <div>
            <div class="time-unit">
                <div class="flip-card" id="second-tens">
                    <div class="flip-card-inner">
                        <div class="flip-card-top">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-bottom">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-flip">
                            <div class="flip-face-front">
                                <div class="flip-card-number">0</div>
                            </div>
                            <div class="flip-face-back">
                                <div class="flip-card-number">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flip-card" id="second-ones">
                    <div class="flip-card-inner">
                        <div class="flip-card-top">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-bottom">
                            <div class="flip-card-number">0</div>
                        </div>
                        <div class="flip-card-flip">
                            <div class="flip-face-front">
                                <div class="flip-card-number">0</div>
                            </div>
                            <div class="flip-face-back">
                                <div class="flip-card-number">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="label">Seconds</div>
        </div>
    </div>

    <script>
        function pad(num) {
            return num < 10 ? '0' + num : num.toString();
        }

        function updateFlipCard(cardId, newValue) {
            var card = document.getElementById(cardId);
            var topNumber = card.querySelector('.flip-card-top .flip-card-number');
            var bottomNumber = card.querySelector('.flip-card-bottom .flip-card-number');
            var flipFrontNumber = card.querySelector('.flip-face-front .flip-card-number');
            var flipBackNumber = card.querySelector('.flip-face-back .flip-card-number');
            var flipCard = card.querySelector('.flip-card-flip');

            var currentValue = topNumber.textContent;

            if (currentValue !== newValue) {
                // 1. Prepare the static top (Underneath) to show the NEW value
                // This will be revealed as the flap flips down
                topNumber.textContent = newValue;

                // 2. Prepare the static bottom (Underneath) to show the CURRENT value
                // This will be covered when the flap finishes flipping
                bottomNumber.textContent = currentValue;

                // 3. Prepare the Flap
                // Front face: Shows CURRENT value (Top half)
                flipFrontNumber.textContent = currentValue;
                // Back face: Shows NEW value (Bottom half)
                flipBackNumber.textContent = newValue;

                // Remove previous animation
                flipCard.className = 'flip-card-flip';

                // Force reflow
                void flipCard.offsetWidth;

                // Start animation
                flipCard.className = 'flip-card-flip flipping';

                // After animation completes
                setTimeout(function () {
                    // The flap has landed. It is now covering the bottom.
                    // We update the static bottom to the new value.
                    bottomNumber.textContent = newValue;

                    // Reset the flap
                    flipCard.className = 'flip-card-flip';
                    flipFrontNumber.textContent = newValue;
                    flipBackNumber.textContent = newValue;
                }, 600);
            }
        }

        function updateClock() {
            var now = new Date();
            var hours = pad(now.getHours());
            var minutes = pad(now.getMinutes());
            var seconds = pad(now.getSeconds());

            updateFlipCard('hour-tens', hours.charAt(0));
            updateFlipCard('hour-ones', hours.charAt(1));
            updateFlipCard('minute-tens', minutes.charAt(0));
            updateFlipCard('minute-ones', minutes.charAt(1));
            updateFlipCard('second-tens', seconds.charAt(0));
            updateFlipCard('second-ones', seconds.charAt(1));
        }

        // Initialize clock
        updateClock();

        // Update every second
        setInterval(updateClock, 1000);
    </script>
</body>

</html>
